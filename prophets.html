<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سبيل - الأذكار</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="global.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
        body {
            font-family: 'Tajawal', sans-serif;
            color: var(--text-dark);
            background-color: var(--primary-white);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        :root {
            --primary-white: #ffffff;
            --primary-soft-green: #e9f5ec;
            --primary-deep-green: #1a4a38;
            --primary-gold: #d4af37;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --border-radius-lg: 24px;
            --border-radius-md: 16px;
            --border-radius-sm: 8px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --primary-white: #0f172a;
            --primary-soft-green: #1e293b;
            --primary-deep-green: #064e3b;
            --primary-gold: #fbbf24;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .site-bg { position: fixed; inset: 0; background-image: url('https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center; z-index: -2; }
        .bg-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(5px); z-index: -1; transition: var(--transition-smooth); }
        [data-theme="dark"] .bg-overlay { background: rgba(15, 23, 42, 0.85); }

        .container { width: 100%; padding: 0 0.5rem; margin: 0 auto; max-width: 800px; }

        header { padding: 0.8rem 0; position: sticky; top: 0; z-index: 100; background: var(--glass-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); }
        .header-content { display: flex; justify-content: space-between; align-items: center; padding: 0 0.5rem; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary-deep-green); text-decoration: none; }
        [data-theme="dark"] .logo { color: var(--primary-gold); }
        .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
        .hamburger { background: transparent; border: none; color: var(--text-dark); font-size: 1.5rem; cursor: pointer; padding: 0.25rem; display: flex; }

        /* القائمة الجانبية الموحدة */
        .mobile-nav {
            position: fixed;
            top: 0;
            left: -100%;
            width: 85%;
            max-width: 320px;
            height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            transition: left 0.35s ease-in-out;
            z-index: 200;
            overflow-y: auto;
            padding: 1.5rem 1rem;
        }

        .mobile-nav.active { left: 0; }

        .mobile-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .mobile-nav-header h3 {
            color: var(--primary-deep-green);
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0;
        }

        [data-theme="dark"] .mobile-nav-header h3 { color: var(--primary-gold); }

        .close-menu {
            background: transparent;
            border: none;
            color: var(--text-dark);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }

        .close-menu:hover { background: rgba(0, 0, 0, 0.05); }

        .mobile-nav ul {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .mobile-nav ul li a {
            display: block;
            padding: 0.9rem 1rem;
            border-radius: var(--border-radius-sm);
            font-weight: 500;
            font-size: 1.05rem;
            font-family: 'Tajawal', sans-serif;
            background: rgba(0, 0, 0, 0.03);
            transition: var(--transition-smooth);
            text-decoration: none;
            color: inherit;
        }

        [data-theme="dark"] .mobile-nav ul li a { background: rgba(255, 255, 255, 0.05); }

        .mobile-nav ul li a:hover {
            background: var(--primary-gold);
            color: var(--primary-deep-green);
            transform: translateX(-5px);
        }

        .menu-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 199;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .menu-overlay.active { opacity: 1; visibility: visible; }
        body.menu-open { overflow: hidden; }

        .page-title {
            text-align: center;
            padding: 1rem 0 0.8rem;
            color: var(--primary-deep-green);
            font-size: 1.5rem;
            font-weight: 800;
        }
        [data-theme="dark"] .page-title { color: var(--primary-gold); }

        .categories-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 0 12px;
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            flex-shrink: 0;
            padding: 6px 12px;
            border-radius: 50px;
            background: var(--primary-soft-green);
            color: var(--primary-deep-green);
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.75rem;
            white-space: nowrap;
            border: none;
            font-family: 'Tajawal', sans-serif;
        }
        .cat-chip.active { background: var(--primary-gold); color: white; }
        [data-theme="dark"] .cat-chip { background: rgba(255,255,255,0.08); color: var(--text-dark); }
        [data-theme="dark"] .cat-chip.active { background: var(--primary-gold); color: #1a4a38; }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
            outline: none;
            background: var(--glass-bg);
            color: var(--text-dark);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9rem;
        }

        .dhikr-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-bottom: 30px;
        }
        .dhikr-card {
            background: linear-gradient(135deg, #1a4a38 0%, #10b981 100%);
            color: #ffffff;
            padding: 1rem;
            border-radius: 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
            transition: 0.2s;
        }
        .dhikr-card:active { transform: scale(0.97); }
        [data-theme="dark"] .dhikr-card {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #1a4a38;
        }
        .dhikr-card .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .dhikr-card .card-text {
            font-family: 'Amiri', serif;
            font-size: 0.8rem;
            line-height: 1.7;
            flex: 1;
            
            margin-bottom: 0.5rem;
        }
        .dhikr-card .card-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: auto;
        }
        .dhikr-card .action-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .dhikr-card .action-btn:active { background: rgba(255,255,255,0.4); transform: scale(0.95); }
        .dhikr-card .action-btn:disabled { opacity: 0.5; pointer-events: none; }
        [data-theme="dark"] .dhikr-card .action-btn {
            background: rgba(26,74,56,0.2);
            border-color: rgba(26,74,56,0.3);
            color: #1a4a38;
        }
        .counter-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-counter {
            background: rgba(255, 255, 255, 0.25);
            border: none;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }
        .btn-counter.completed {
            background: #10b981;
            pointer-events: none;
        }
        .btn-reset-counter {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        [data-theme="dark"] .btn-counter { background: rgba(26, 74, 56, 0.3); color: #1a4a38; }
        [data-theme="dark"] .btn-reset-counter { background: rgba(26, 74, 56, 0.2); color: #1a4a38; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a4a38;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            z-index: 999;
            pointer-events: none;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
        }
        [data-theme="dark"] .toast { background: #fbbf24; color: #1a4a38; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        @media (max-width: 400px) {
            .dhikr-card { padding: 0.7rem; }
            .dhikr-card .card-title { font-size: 0.75rem; }
            .dhikr-card .card-text { font-size: 0.7rem;  }
            .dhikr-card .action-btn { width: 26px; height: 26px; font-size: 0.75rem; }
            .btn-counter { padding: 3px 8px; font-size: 0.65rem; }
        }
    </style>
</head>

  { "id": 9, "title": "الحمد لله الذي أحيانا", "category": "أذكار الاستيقاظ", "text": "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ.", "repeat": 1, "source": "البخاري", "benefits": "شكر الله على نعمة الحياة المتجددة.", "tags": ["استيقاظ", "حمد"] },
  { "id": 10, "title": "التسبيح قبل النوم", "category": "أذكار النوم", "text": "سُبْحَانَ اللَّهِ (33 مرة)، الْحَمْدُ لِلَّهِ (33 مرة)، اللَّهُ أَكْبَرُ (34 مرة).", "repeat": 1, "source": "البخاري", "benefits": "أفضل من خادم يعين على التعب.", "tags": ["نوم", "تسبيح", "فاطمة"] },
  { "id": 11, "title": "الاستغفار والسلام", "category": "أذكار بعد الصلاة", "text": "أَسْتَغْفِرُ اللَّهَ (ثَلاثاً) اللَّهُمَّ أَنْتَ السَّلامُ ، وَمِنْكَ السَّلامُ ، تَبَارَكْتَ يَا ذَا الْجَلالِ وَالإِكْرَامِ.", "repeat": 1, "source": "مسلم", "benefits": "مغفرة النقص في الصلاة.", "tags": ["صلاة", "استغفار"] },
  { "id": 12, "title": "لا إله إلا الله وحده", "category": "أذكار بعد الصلاة", "text": "لا إِلَهَ إِلا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لا مَانِعَ لِمَا أَعْطَيْتَ، وَلا مُعْطِيَ لِمَا مَنَعْتَ، وَلا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.", "repeat": 1, "source": "متفق عليه", "benefits": "تأكيد التوحيد والاستسلام لقضاء الله.", "tags": ["صلاة", "توحيد"] },
  { "id": 13, "title": "تسبيحات دبر الصلاة", "category": "أذكار بعد الصلاة", "text": "سُبْحَانَ اللَّهِ (33)، وَالْحَمْدُ لِلَّهِ (33)، وَاللَّهُ أَكْبَرُ (33)، ثُمَّ يَقُولُ تَمَامَ الْمِائَةِ: لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", "repeat": 1, "source": "مسلم", "benefits": "غُفرت خطاياه وإن كانت مثل زبد البحر.", "tags": ["صلاة", "تسبيح"] },
  { "id": 14, "title": "آية الكرسي", "category": "أذكار بعد الصلاة", "text": "اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ... (الآية)", "repeat": 1, "source": "النسائي", "benefits": "لم يمنعه من دخول الجنة إلا أن يموت.", "tags": ["صلاة", "قرآن", "جنة"] },
  { "id": 15, "title": "دعاء الكرب", "category": "أذكار الهم والكرب", "text": "لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ.", "repeat": 1, "source": "البخاري", "benefits": "تفريج الهم والكرب العظيم.", "tags": ["كرب", "هم"] },
  { "id": 16, "title": "دعاء ذي النون", "category": "أذكار الهم والكرب", "text": "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ.", "repeat": 1, "source": "الترمذي", "benefits": "ما دعا بها مكروب إلا فرج الله عنه.", "tags": ["كرب", "يونس"] },
  { "id": 17, "title": "يا حي يا قيوم", "category": "أذكار الهم والكرب", "text": "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.", "repeat": 1, "source": "النسائي", "benefits": "استغاثة بالله وقت الشدة وإصلاح الشأن.", "tags": ["استغاثة", "كرب"] },
  { "id": 18, "title": "الاستغفار العظيم", "category": "أذكار الاستغفار", "text": "أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيَّ الْقَيُّومَ وَأَتُوبُ إِلَيْهِ.", "repeat": 3, "source": "أبو داود", "benefits": "غُفر له وإن كان قد فر من الزحف.", "tags": ["استغفار", "توبة"] },
  { "id": 19, "title": "بعد الفراغ من الطعام", "category": "أذكار الطعام", "text": "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.", "repeat": 1, "source": "أبو داود", "benefits": "غُفر له ما تقدم من ذنبه.", "tags": ["طعام", "حمد"] },
  { "id": 20, "title": "بعد الوضوء", "category": "أذكار الوضوء", "text": "أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ. اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ.", "repeat": 1, "source": "مسلم والترمذي", "benefits": "تُفتح له أبواب الجنة الثمانية يدخل من أيها شاء.", "tags": ["وضوء", "طهارة"] },
  { "id": 21, "title": "دخول المسجد", "category": "أذكار المسجد", "text": "بِسْمِ اللَّهِ، وَالصَّلاةُ وَالسَّلامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.", "repeat": 1, "source": "مسلم", "benefits": "طلب الرحمة والتوفيق من الله.", "tags": ["مسجد", "رحمة"] },
  { "id": 22, "title": "دعاء السفر", "category": "أذكار السفر", "text": "اللهُ أكبَر، اللهُ أكبَر، اللهُ أكبَر، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ...", "repeat": 1, "source": "مسلم", "benefits": "الحفظ في السفر وتسهيل المشقة.", "tags": ["سفر", "حفظ"] },
  { "id": 23, "title": "التسبيح والتحميد", "category": "أذكار عامة", "text": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.", "repeat": 100, "source": "متفق عليه", "benefits": "حُطت خطاياه وإن كانت مثل زبد البحر.", "tags": ["تسبيح", "عام"] },
  { "id": 24, "title": "الكلمتان الحبيبتان", "category": "أذكار عامة", "text": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ.", "repeat": 1, "source": "متفق عليه", "benefits": "ثقيلتان في الميزان حبيبتان للرحمن.", "tags": ["ميزان", "تسبيح"] },
  { "id": 25, "title": "كنز الجنة", "category": "أذكار عامة", "text": "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.", "repeat": 1, "source": "متفق عليه", "benefits": "كنز من كنوز الجنة.", "tags": ["حوقلة", "جنة"] },
  { "id": 26, "title": "اللهم بك أصبحنا", "category": "أذكار الصباح", "text": "اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.", "repeat": 1, "source": "الترمذي", "benefits": "اعتراف بتصريف الله للأمور.", "tags": ["صباح"] },
  { "id": 27, "title": "اللهم بك أمسينا", "category": "أذكار المساء", "text": "اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.", "repeat": 1, "source": "الترمذي", "benefits": "اعتراف بتصريف الله للأمور في المساء.", "tags": ["مساء"] },
  { "id": 28, "title": "شكر النعمة", "category": "أذكار الصباح", "text": "اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.", "repeat": 1, "source": "أبو داود", "benefits": "من قالها حين يصبح فقد أدى شكر يومه.", "tags": ["صباح", "شكر"] },
  { "id": 29, "title": "الإشهاد", "category": "أذكار الصباح", "text": "اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.", "repeat": 4, "source": "أبو داود", "benefits": "من قالها أعتقه الله من النار.", "tags": ["صباح", "توحيد"] },
  { "id": 30, "title": "سبحان الله وبحمده عدد خلقه", "category": "أذكار الصباح", "text": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ.", "repeat": 3, "source": "مسلم", "benefits": "أجر عظيم يعادل أضعاف التسبيح.", "tags": ["صباح", "تسبيح"] },
  { "id": 31, "title": "أعوذ بكلمات الله التامات", "category": "أذكار المساء", "text": "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", "repeat": 3, "source": "مسلم", "benefits": "لا يضره شيء في تلك الليلة.", "tags": ["مساء", "حفظ"] },
  { "id": 32, "title": "عالم الغيب", "category": "أذكار الصباح", "text": "اللَّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَوَاتِ وَالأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ.", "repeat": 1, "source": "الترمذي", "benefits": "حفظ من شر النفس والشيطان.", "tags": ["صباح", "مساء", "حفظ"] },
  { "id": 33, "title": "سؤال العلم والرزق", "category": "أذكار الصباح", "text": "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.", "repeat": 1, "source": "ابن ماجه", "benefits": "دعاء بالتوفيق للعمل الصالح والرزق الحلال.", "tags": ["صباح", "دعاء"] },
  { "id": 34, "title": "المعوذات للصباح والمساء", "category": "أذكار الصباح", "text": "قراءة سورة الإخلاص، والفلق، والناس.", "repeat": 3, "source": "أبو داود", "benefits": "تكفيك من كل شيء.", "tags": ["صباح", "مساء", "قرآن"] },
  { "id": 35, "title": "باسمك ربي", "category": "أذكار النوم", "text": "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وَبِكَ أَرْفَعُهُ، إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ.", "repeat": 1, "source": "البخاري", "benefits": "تفويض الأمر لله وحفظ النفس.", "tags": ["نوم", "حفظ"] },
  { "id": 36, "title": "الوقاية من العذاب", "category": "أذكار النوم", "text": "اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.", "repeat": 3, "source": "الترمذي", "benefits": "دعاء بالنجاة من عذاب الآخرة.", "tags": ["نوم", "آخرة"] },
  { "id": 37, "title": "قراءة الكافرون", "category": "أذكار النوم", "text": "قراءة سورة الكافرون.", "repeat": 1, "source": "أبو داود", "benefits": "براءة من الشرك.", "tags": ["نوم", "قرآن"] },
  { "id": 38, "title": "إسلام النفس", "category": "أذكار النوم", "text": "اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ رَغْبَةً وَرَهْبَةً إِلَيْكَ...", "repeat": 1, "source": "البخاري", "benefits": "من مات من ليلته مات على الفطرة.", "tags": ["نوم", "تفويض"] },
  { "id": 39, "title": "دعاء التعار من الليل", "category": "أذكار الاستيقاظ", "text": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ... اللَّهُمَّ اغْفِرْ لِي.", "repeat": 1, "source": "البخاري", "benefits": "من قالها ثم دعا استجيب له.", "tags": ["استيقاظ", "تهجد"] },
  { "id": 40, "title": "لبس الثوب", "category": "أذكار اللباس", "text": "الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا الثَّوْبَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.", "repeat": 1, "source": "أبو داود", "benefits": "غفر له ما تقدم من ذنبه.", "tags": ["لباس", "حمد"] },
  { "id": 41, "title": "لبس ثوب جديد", "category": "أذكار اللباس", "text": "اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ.", "repeat": 1, "source": "الترمذي", "benefits": "شكر النعمة ودفع شرها.", "tags": ["لباس", "شكر"] },
  { "id": 42, "title": "الخروج من المنزل", "category": "أذكار المنزل", "text": "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.", "repeat": 1, "source": "أبو داود", "benefits": "يُقال له هُديت وكُفيت ووُقيت.", "tags": ["خروج", "توكل"] },
  { "id": 43, "title": "الدخول إلى المنزل", "category": "أذكار المنزل", "text": "بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا.", "repeat": 1, "source": "أبو داود", "benefits": "طرد الشيطان من البيت.", "tags": ["دخول", "توكل"] },
  { "id": 44, "title": "دخول الخلاء", "category": "أذكار الخلاء", "text": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ.", "repeat": 1, "source": "البخاري", "benefits": "الاستعاذة من شياطين الجن.", "tags": ["خلاء", "استعاذة"] },
  { "id": 45, "title": "الخروج من الخلاء", "category": "أذكار الخلاء", "text": "غُفْرَانَكَ.", "repeat": 1, "source": "أبو داود", "benefits": "طلب المغفرة لتقصير الشكر.", "tags": ["خلاء", "استغفار"] },
  { "id": 46, "title": "سماع الأذان", "category": "أذكار الأذان", "text": "يقول مثل ما يقول المؤذن إلا في الحيعلتين فيقول: لا حول ولا قوة إلا بالله.", "repeat": 1, "source": "البخاري", "benefits": "دخول الجنة.", "tags": ["أذان", "ترديد"] },
  { "id": 47, "title": "بعد الأذان", "category": "أذكار الأذان", "text": "اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ.", "repeat": 1, "source": "البخاري", "benefits": "حلت له الشفاعة يوم القيامة.", "tags": ["أذان", "شفاعة"] },
  { "id": 48, "title": "دعاء الاستفتاح", "category": "أذكار الصلاة", "text": "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ.", "repeat": 1, "source": "مسلم", "benefits": "الثناء على الله قبل الشروع في الصلاة.", "tags": ["صلاة", "استفتاح"] },
  { "id": 49, "title": "دعاء الركوع", "category": "أذكار الصلاة", "text": "سُبْحَانَ رَبِّيَ الْعَظِيمِ.", "repeat": 3, "source": "أبو داود", "benefits": "تعظيم الله عز وجل.", "tags": ["صلاة", "ركوع"] },
  { "id": 50, "title": "الرفع من الركوع", "category": "أذكار الصلاة", "text": "رَبَّنَا وَلَكَ الْحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ.", "repeat": 1, "source": "البخاري", "benefits": "ابتدرها الملائكة أيهم يكتبها أولاً.", "tags": ["صلاة", "قيام"] },
  { "id": 51, "title": "دعاء السجود", "category": "أذكار الصلاة", "text": "سُبْحَانَ رَبِّيَ الْأَعْلَى.", "repeat": 3, "source": "أبو داود", "benefits": "أقرب ما يكون العبد من ربه وهو ساجد.", "tags": ["صلاة", "سجود"] },
  { "id": 52, "title": "بين السجدتين", "category": "أذكار الصلاة", "text": "رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي.", "repeat": 1, "source": "أبو داود", "benefits": "طلب المغفرة المستمر.", "tags": ["صلاة", "استغفار"] },
  { "id": 53, "title": "التشهد", "category": "أذكار الصلاة", "text": "التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ...", "repeat": 1, "source": "البخاري", "benefits": "تسليم على الله ورسوله والصالحين.", "tags": ["صلاة", "تشهد"] },
  { "id": 54, "title": "الصلاة الإبراهيمية", "category": "أذكار الصلاة", "text": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ...", "repeat": 1, "source": "البخاري", "benefits": "أعظم صيغ الصلاة على النبي.", "tags": ["صلاة", "نبي"] },
  { "id": 55, "title": "قبل السلام", "category": "أذكار الصلاة", "text": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ قَبْرٍ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ...", "repeat": 1, "source": "البخاري", "benefits": "الاستعاذة من الفتن العظيمة.", "tags": ["صلاة", "استعاذة"] },
  { "id": 56, "title": "دعاء الاستخارة", "category": "أذكار منوعة", "text": "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ...", "repeat": 1, "source": "البخاري", "benefits": "توكيل الله لاختيار الأفضل.", "tags": ["استخارة", "دعاء"] },
  { "id": 57, "title": "دعاء المريض لنفسه", "category": "أذكار المرض", "text": "يضع يده على الذي يتألم ويقول: بِسْمِ اللَّهِ (3 مرات) أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (7 مرات).", "repeat": 1, "source": "مسلم", "benefits": "شفاء وتخفيف للألم.", "tags": ["مرض", "شفاء"] },
  { "id": 58, "title": "عيادة المريض", "category": "أذكار المرض", "text": "أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ.", "repeat": 7, "source": "أبو داود", "benefits": "شفاء للمريض بإذن الله.", "tags": ["مرض", "زيارة"] },
  { "id": 59, "title": "دعاء المصيبة", "category": "أذكار الهم والكرب", "text": "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا.", "repeat": 1, "source": "مسلم", "benefits": "يعوضه الله خيراً منها.", "tags": ["مصيبة", "صبر"] },
  { "id": 60, "title": "دعاء الغضب", "category": "أذكار منوعة", "text": "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ.", "repeat": 1, "source": "البخاري", "benefits": "يذهب عنه الغضب.", "tags": ["غضب", "استعاذة"] },
  { "id": 61, "title": "صعوبة الأمر", "category": "أذكار منوعة", "text": "اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا.", "repeat": 1, "source": "ابن حبان", "benefits": "تيسير الأمور الصعبة.", "tags": ["تيسير", "صعوبة"] },
  { "id": 62, "title": "دعاء الريح", "category": "أذكار الطبيعة", "text": "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَأَعُوذُ بِكَ مِنْ شَرِّهَا.", "repeat": 1, "source": "أبو داود", "benefits": "طلب الخير ودفع الضرر.", "tags": ["ريح", "طبيعة"] },
  { "id": 63, "title": "سماع الرعد", "category": "أذكار الطبيعة", "text": "سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ.", "repeat": 1, "source": "الموطأ", "benefits": "تعظيم قدرة الله.", "tags": ["رعد", "طبيعة"] },
  { "id": 64, "title": "نزول المطر", "category": "أذكار الطبيعة", "text": "اللَّهُمَّ صَيِّبًا نَافِعًا.", "repeat": 1, "source": "البخاري", "benefits": "طلب النفع والبركة في المطر.", "tags": ["مطر", "طبيعة"] },
  { "id": 65, "title": "بعد نزول المطر", "category": "أذكار الطبيعة", "text": "مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ.", "repeat": 1, "source": "البخاري", "benefits": "نسبة النعمة إلى الله.", "tags": ["مطر", "شكر"] },
  { "id": 66, "title": "رؤية الهلال", "category": "أذكار منوعة", "text": "اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، رَبِّي وَرَبُّكَ اللَّهُ.", "repeat": 1, "source": "الترمذي", "benefits": "طلب البركة في الشهر الجديد.", "tags": ["هلال", "شهر"] },
  { "id": 67, "title": "الإفطار للصائم", "category": "أذكار الطعام", "text": "ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ.", "repeat": 1, "source": "أبو داود", "benefits": "شكر النعمة بعد الصيام.", "tags": ["صيام", "إفطار"] },
  { "id": 68, "title": "الدعاء لمن أطعمك", "category": "أذكار الطعام", "text": "اللَّهُمَّ أَطْعِمْ مَنْ أَطْعَمَنِي وَاسْقِ مَنْ سَقَانِي.", "repeat": 1, "source": "مسلم", "benefits": "رد الجميل بالدعاء.", "tags": ["طعام", "شكر"] },
  { "id": 69, "title": "العطاس", "category": "أذكار منوعة", "text": "الْحَمْدُ لِلَّهِ.", "repeat": 1, "source": "البخاري", "benefits": "شكر الله على نعمة العافية.", "tags": ["عطاس", "حمد"] },
  { "id": 70, "title": "تشميت العاطس", "category": "أذكار منوعة", "text": "يَرْحَمُكَ اللَّهُ.", "repeat": 1, "source": "البخاري", "benefits": "دعاء بالرحمة للأخ المسلم.", "tags": ["عطاس", "رحمة"] },
  { "id": 71, "title": "رد المشمت", "category": "أذكار منوعة", "text": "يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ.", "repeat": 1, "source": "البخاري", "benefits": "دعاء متبادل بالهداية وإصلاح الحال.", "tags": ["عطاس", "هداية"] },
  { "id": 72, "title": "كفارة المجلس", "category": "أذكار منوعة", "text": "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.", "repeat": 1, "source": "الترمذي", "benefits": "غفران ما كان في المجلس من لغو.", "tags": ["مجلس", "استغفار"] },
  { "id": 73, "title": "دعاء الركوب", "category": "أذكار السفر", "text": "بِسْمِ اللَّهِ، الْحَمْدُ لِلَّهِ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ.", "repeat": 1, "source": "أبو داود", "benefits": "حفظ ورعاية أثناء الركوب.", "tags": ["سفر", "ركوب"] },
  { "id": 74, "title": "توديع المسافر", "category": "أذكار السفر", "text": "أَسْتَوْدِعُ اللَّهَ دِينَكَ وَأَمَانَتَكَ وَخَوَاتِيمَ عَمَلِكَ.", "repeat": 1, "source": "الترمذي", "benefits": "حفظ الله للمسافر في سفره.", "tags": ["سفر", "توديع"] },
  { "id": 75, "title": "دعاء الرجوع من السفر", "category": "أذكار السفر", "text": "آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ.", "repeat": 1, "source": "مسلم", "benefits": "شكر الله على العودة سالماً.", "tags": ["سفر", "رجوع"] },
  { "id": 76, "title": "دخول السوق", "category": "أذكار منوعة", "text": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ حَيٌّ لَا يَمُوتُ بِيَدِهِ الْخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", "repeat": 1, "source": "الترمذي", "benefits": "كُتبت له ألف ألف حسنة.", "tags": ["سوق", "أجر"] },
  { "id": 77, "title": "الاستغفار", "category": "أذكار الاستغفار", "text": "أَسْتَغْفِرُ اللَّهَ.", "repeat": 100, "source": "مسلم", "benefits": "تفريج الهموم وجلب الرزق.", "tags": ["استغفار", "عام"] },
  { "id": 78, "title": "الصلاة على النبي الميت", "category": "أذكار منوعة", "text": "اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مُدْخَلَهُ...", "repeat": 1, "source": "مسلم", "benefits": "شفاعة وطلب الرحمة للميت.", "tags": ["ميت", "جنازة"] },
  { "id": 79, "title": "التعزية", "category": "أذكار منوعة", "text": "إِنَّ لِلَّهِ مَا أَخَذَ وَلَهُ مَا أَعْطَى وَكُلٌّ عِنْدَهُ بِأَجَلٍ مُسَمًّى فَلْتَصْبِرْ وَلْتَحْتَسِبْ.", "repeat": 1, "source": "البخاري", "benefits": "مواساة وتذكير بالصبر.", "tags": ["تعزية", "صبر"] },
  { "id": 80, "title": "دخول المقبرة", "category": "أذكار منوعة", "text": "السَّلَامُ عَلَيْكُمْ دَارَ قَوْمٍ مُؤْمِنِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ.", "repeat": 1, "source": "مسلم", "benefits": "الدعاء للأموات والتذكرة بالآخرة.", "tags": ["قبر", "آخرة"] },
  { "id": 81, "title": "الصلاة على النبي", "category": "أذكار عامة", "text": "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ.", "repeat": 10, "source": "الطبراني", "benefits": "أدركته شفاعة النبي يوم القيامة.", "tags": ["نبي", "صلاة"] },
  { "id": 82, "title": "الباقيات الصالحات", "category": "أذكار عامة", "text": "سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ.", "repeat": 10, "source": "مسلم", "benefits": "غراس الجنة.", "tags": ["تسبيح", "جنة"] },
  { "id": 83, "title": "أذكار الصباح (الفطرة)", "category": "أذكار الصباح", "text": "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا.", "repeat": 1, "source": "أحمد", "benefits": "تجديد العهد على دين الإسلام.", "tags": ["صباح", "إسلام"] },
  { "id": 84, "title": "أذكار المساء (الفطرة)", "category": "أذكار المساء", "text": "أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا.", "repeat": 1, "source": "أحمد", "benefits": "تجديد العهد مساءً.", "tags": ["مساء", "إسلام"] },
  { "id": 85, "title": "دعاء الحزن", "category": "أذكار الهم والكرب", "text": "اللَّهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ...", "repeat": 1, "source": "أحمد", "benefits": "أذهب الله حزنه وأبدله فرحاً.", "tags": ["حزن", "هم"] },
  { "id": 86, "title": "قضاء الدين", "category": "أذكار الهم والكرب", "text": "اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ.", "repeat": 1, "source": "الترمذي", "benefits": "أدى الله عنه دينه.", "tags": ["دين", "رزق"] },

    const categories = ["الكل", "أذكار الصباح", "أذكار المساء", "أذكار النوم", "أذكار الاستيقاظ", "أذكار عامة"];
    
    let favorites = JSON.parse(localStorage.getItem('sabeel_adhkar_favs') || '[]');
    let progress = JSON.parse(localStorage.getItem('sabeel_adhkar_progress') || '{}');
    let currentCategory = "الكل";

    // ==================== دوال مساعدة ====================
    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    // ==================== دالة مشاركة البطاقة كصورة (مثل odea) ====================
    async function shareCard(cardElement) {
        if (typeof html2canvas === 'undefined') {
            showToast("جاري تحميل المكتبة...");
            return;
        }

        try {
            // إخفاء الأزرار أثناء التصوير
            const footer = cardElement.querySelector('.card-footer');
            if (footer) footer.style.display = 'none';

            const canvas = await html2canvas(cardElement, {
                scale: 3,
                useCORS: true,
                backgroundColor: null,
                allowTaint: false,
                logging: false
            });

            if (footer) footer.style.display = '';

            // العلامة المائية
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = 'rgba(0,0,0,0.32)';
            ctx.fillRect(0, h - 54, w, 54);
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.round(w * 0.042)}px Tajawal, Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🌿 تطبيق سبيل', w / 2, h - 27);

            const imageData = canvas.toDataURL('image/png');
            
            // محاولة المشاركة عبر Capacitor Share
            if (typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) {
                try {
                    const { Share, Filesystem } = Capacitor.Plugins;
                    const base64Data = imageData.split(',')[1];
                    const fileName = 'sabeel_dhikr_' + new Date().getTime() + '.png';
                    const savedFile = await Filesystem.writeFile({
                        path: fileName,
                        data: base64Data,
                        directory: 'CACHE'
                    });
                    await Share.share({
                        title: 'ذكر من تطبيق سبيل',
                        text: 'سبيل - أذكار وأدعية إسلامية',
                        url: savedFile.uri,
                        dialogTitle: 'شارك الذكر'
                    });
                    showToast("✅ تمت المشاركة");
                } catch(e) {
                    console.log("Capacitor share error:", e);
                    downloadImage(imageData);
                }
            } 
            // مشاركة ويب
            else if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([], "image.png")] })) {
                try {
                    const blob = await (await fetch(imageData)).blob();
                    const file = new File([blob], 'dhikr.png', { type: 'image/png' });
                    await navigator.share({
                        title: 'ذكر من تطبيق سبيل',
                        text: cardElement.querySelector('.card-text')?.innerText || '',
                        files: [file]
                    });
                    showToast("✅ تمت المشاركة");
                } catch(e) {
                    if (e.name !== 'AbortError') downloadImage(imageData);
                }
            } 
            else {
                downloadImage(imageData);
            }
        } catch (error) {
            console.error("خطأ في التصوير:", error);
            showToast("عذراً، حدث خطأ");
        }
    }

    function downloadImage(imageData) {
        const link = document.createElement('a');
        link.download = 'ذكر_سبيل.png';
        link.href = imageData;
        link.click();
        showToast("📸 تم حفظ الصورة");
    }

    // ==================== دوال العداد والمفضلة ====================
    function incrementCounter(id, repeat, btnElement) {
        let current = progress[id] || 0;
        if (current < repeat) {
            current++;
            progress[id] = current;
            localStorage.setItem('sabeel_adhkar_progress', JSON.stringify(progress));
            if (current >= repeat) {
                btnElement.textContent = '✅ تم';
                btnElement.classList.add('completed');
                showToast("✨ مبروك! أتممت هذا الذكر");
            } else {
                btnElement.textContent = `🔄 ${current}/${repeat}`;
            }
        }
    }

    function resetCounter(id, repeat) {
        progress[id] = 0;
        localStorage.setItem('sabeel_adhkar_progress', JSON.stringify(progress));
        renderDhikr();
        showToast("🔄 تم تصفير العداد");
    }

    function toggleFavorite(id) {
        if (favorites.includes(id)) {
            favorites = favorites.filter(f => f !== id);
            showToast("❌ تمت الإزالة من المفضلة");
        } else {
            favorites.push(id);
            showToast("❤️ تمت الإضافة إلى المفضلة");
        }
        localStorage.setItem('sabeel_adhkar_favs', JSON.stringify(favorites));
        renderDhikr();
    }

    function copyDhikr(text) {
        navigator.clipboard.writeText(text).then(() => showToast("📋 تم النسخ بنجاح"));
    }

    // ==================== دوال التصفية والعرض ====================
    function getFilteredDhikr() {
        let filtered = [...adhkarData];
        if (currentCategory !== "الكل") {
            filtered = filtered.filter(d => d.category === currentCategory);
        }
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        if (searchTerm) {
            filtered = filtered.filter(d => d.title.toLowerCase().includes(searchTerm) || d.text.toLowerCase().includes(searchTerm));
        }
        return filtered;
    }

    function renderDhikr() {
        const filtered = getFilteredDhikr();
        const grid = document.getElementById('dhikrGrid');
        
        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-state">لا توجد أذكار مطابقة</div>';
            return;
        }
        
        grid.innerHTML = filtered.map(d => {
            const isFav = favorites.includes(d.id);
            const currentCount = progress[d.id] || 0;
            const isCompleted = currentCount >= d.repeat;
            const escapedText = d.text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            
            return `
                <div class="dhikr-card" data-dhikr-id="${d.id}">
                    <div class="card-title">${d.title}</div>
                    <div class="card-text">${d.text}</div>
                    <div class="counter-wrapper">
                        <button class="btn-reset-counter" data-id="${d.id}" data-repeat="${d.repeat}">↺</button>
                        <button class="btn-counter ${isCompleted ? 'completed' : ''}" data-id="${d.id}" data-repeat="${d.repeat}">${isCompleted ? '✅ تم' : `🔄 ${currentCount}/${d.repeat}`}</button>
                    </div>
                    <div class="card-footer">
                        <button class="action-btn share-btn">
                            <img src="https://cdn-icons-png.flaticon.com/128/929/929539.png" style="width:16px;height:16px;" alt="share">
                        </button>
                        <button class="action-btn copy-btn" data-text="${escapedText}">📋</button>
                        <button class="action-btn fav-btn" data-id="${d.id}">${isFav ? '♥' : '♡'}</button>
                    </div>
                </div>
            `;
        }).join('');
        
        // ربط أحداث العدادات
        document.querySelectorAll('.btn-counter').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                const repeat = parseInt(btn.dataset.repeat);
                incrementCounter(id, repeat, btn);
            });
        });
        
        document.querySelectorAll('.btn-reset-counter').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                const repeat = parseInt(btn.dataset.repeat);
                resetCounter(id, repeat);
            });
        });
        
        // ربط أحداث النسخ
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const text = btn.dataset.text.replace(/&quot;/g, '"').replace(/&#39;/g, "'");
                copyDhikr(text);
            });
        });
        
        // ربط أحداث المشاركة بالصورة (مثل odea)
        document.querySelectorAll('.share-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const card = btn.closest('.dhikr-card');
                if (card) {
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '⏳';
                    btn.disabled = true;
                    await shareCard(card);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        });
        
        // ربط أحداث المفضلة
        document.querySelectorAll('.fav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                toggleFavorite(id);
            });
        });
    }

    function renderCategories() {
        const catBar = document.getElementById('catBar');
        catBar.innerHTML = categories.map(cat => `
            <button class="cat-chip ${cat === currentCategory ? 'active' : ''}" data-category="${cat}">${cat}</button>
        `).join('');
        
        document.querySelectorAll('.cat-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.dataset.category;
                renderCategories();
                renderDhikr();
            });
        });
    }

    // ==================== القائمة الجانبية ====================
    function initMobileMenu() {
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileNav = document.getElementById('mobileNav');
        const menuOverlay = document.getElementById('menuOverlay');
        const closeMenuBtn = document.getElementById('closeMenuBtn');

        if (!hamburgerBtn || !mobileNav || !menuOverlay || !closeMenuBtn) {
            console.warn('عناصر القائمة الجانبية غير موجودة');
            return;
        }

        function openMenu() {
            mobileNav.classList.add('active');
            menuOverlay.classList.add('active');
            document.body.classList.add('menu-open');
        }

        function closeMenu() {
            mobileNav.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        }

        hamburgerBtn.addEventListener('click', openMenu);
        closeMenuBtn.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);

        mobileNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', closeMenu);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && mobileNav.classList.contains('active')) {
                closeMenu();
            }
        });
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('sabeel_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // ==================== إشعارات Capacitor (للتذكير) ====================
    async function requestNotificationPermission() {
        if (typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform()) {
            try {
                const { LocalNotifications } = Capacitor.Plugins;
                const permission = await LocalNotifications.checkPermissions();
                if (permission.display !== 'granted') {
                    const request = await LocalNotifications.requestPermissions();
                    return request.display === 'granted';
                }
                return true;
            } catch(e) {
                console.log("خطأ في طلب الإذن:", e);
                return false;
            }
        }
        if ("Notification" in window && Notification.permission !== "granted") {
            await Notification.requestPermission();
            return Notification.permission === "granted";
        }
        return false;
    }

    async function scheduleCapacitorNotification(title, body, timeStr, notificationId) {
        if (typeof Capacitor === 'undefined' || !Capacitor.isNativePlatform()) return false;
        try {
            const { LocalNotifications } = Capacitor.Plugins;
            const [hours, minutes] = timeStr.split(':').map(Number);
            const scheduledTime = new Date();
            scheduledTime.setHours(hours, minutes, 0, 0);
            if (scheduledTime.getTime() < Date.now()) {
                scheduledTime.setDate(scheduledTime.getDate() + 1);
            }
            await LocalNotifications.cancel({ notifications: [{ id: notificationId }] });
            await LocalNotifications.schedule({
                notifications: [{
                    id: notificationId,
                    title: title,
                    body: body,
                    schedule: { at: scheduledTime, repeats: true, allowWhileIdle: true },
                    sound: null,
                    smallIcon: "ic_launcher"
                }]
            });
            return true;
        } catch(e) {
            console.log("خطأ في جدولة الإشعار:", e);
            return false;
        }
    }

    async function cancelCapacitorNotification(notificationId) {
        if (typeof Capacitor === 'undefined' || !Capacitor.isNativePlatform()) return;
        try {
            const { LocalNotifications } = Capacitor.Plugins;
            await LocalNotifications.cancel({ notifications: [{ id: notificationId }] });
        } catch(e) {}
    }

    async function updateDhikrNotifications() {
        let settings = { morningDhikrEnabled: false, morningDhikrTime: "06:00", eveningDhikrEnabled: false, eveningDhikrTime: "18:00" };
        try {
            const savedSettings = localStorage.getItem('sabeel_notification_settings');
            if (savedSettings) settings = JSON.parse(savedSettings);
        } catch(e) {}
        
        await cancelCapacitorNotification(1001);
        await cancelCapacitorNotification(1002);
        
        if (settings.morningDhikrEnabled && settings.morningDhikrTime) {
            await scheduleCapacitorNotification("🌿 أذكار الصباح", "اللهم بك أصبحنا، اقرأ أذكار الصباح لتبدأ يومك ببركة", settings.morningDhikrTime, 1001);
        }
        if (settings.eveningDhikrEnabled && settings.eveningDhikrTime) {
            await scheduleCapacitorNotification("🌙 أذكار المساء", "أمسينا وأمسى الملك لله، لا تنس أذكار المساء لتحفظك الله", settings.eveningDhikrTime, 1002);
        }
    }

    function listenToSettingsChanges() {
        window.addEventListener('storage', (e) => {
            if (e.key === 'sabeel_notification_settings') updateDhikrNotifications();
        });
    }

    // ==================== بدء التشغيل ====================
    document.addEventListener('DOMContentLoaded', async () => {
        initTheme();
        initMobileMenu();
        renderCategories();
        renderDhikr();
        
        await requestNotificationPermission();
        await updateDhikrNotifications();
        listenToSettingsChanges();
        
        document.getElementById('searchInput').addEventListener('input', () => renderDhikr());

        // يقرأ ?category= من URL ويفتح القسم المناسب
        // يعمل عند أول تحميل + عند navigate() من Service Worker
        function applyUrlCategory() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlCategory = decodeURIComponent(urlParams.get('category') || '');
            if (urlCategory && categories.includes(urlCategory)) {
                currentCategory = urlCategory;
                renderCategories();
                renderDhikr();
                showToast(`📂 ${urlCategory}`);
                // نرجع للأعلى بعد التبديل
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // تشغيل عند أول فتح
        applyUrlCategory();

        // تشغيل عند تغيير URL (navigate من Service Worker عندما الصفحة مفتوحة)
        window.addEventListener('popstate', applyUrlCategory);

        // كذلك نراقب تغيير الـ URL بشكل مباشر (للمتصفحات التي لا تطلق popstate عند navigate)
        let _lastUrl = location.href;
        const _urlObserver = new MutationObserver(() => {
            if (location.href !== _lastUrl) {
                _lastUrl = location.href;
                applyUrlCategory();
            }
        });
        _urlObserver.observe(document.body, { childList: true, subtree: true });

        if (typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) {
            try {
                const { LocalNotifications } = Capacitor.Plugins;
                LocalNotifications.addListener('localNotificationActionPerformed', (action) => {
                    const cat = action.notification?.extra?.category;
                    if (cat && categories.includes(cat)) {
                        currentCategory = cat;
                        renderCategories();
                        renderDhikr();
                        showToast(`📂 ${cat}`);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            } catch(e) {}
        }
