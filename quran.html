        /* ==================== VARIABLES & THEME ==================== */
        :root {
            --primary-beige: #fdfbf7; --primary-beige-dark: #f0e8d5;

            --primary-green: #064e3b; --primary-gold: #fbbf24;
            --text-dark: #f8fafc; --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.96);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--primary-beige); color: var(--text-dark); min-height: 100vh; transition: 0.3s; position: relative; }
        
        /* BACKGROUND IMAGE */
        .site-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?q=80&w=2000'); background-size: cover; background-position: center; z-index: -2; }

        [data-theme="dark"] .bg-overlay { background: rgba(15, 23, 42, 0.88); }

        .container { width: 100%; max-width: 1200px; padding: 0 1.5rem; margin: 0 auto; }
        .glass-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: var(--shadow); padding: 2rem; transition: 0.3s; }
        .hidden { display: none !important; }

        /* ==================== HEADER ==================== */
        header { padding: 1.2rem 0; position: sticky; top: 0; z-index: 100; background: var(--glass-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; font-weight: 800; color: var(--primary-green); text-decoration: none; font-family: 'Amiri'; }
        [data-theme="dark"] .logo { color: var(--primary-gold); }
        .desktop-nav ul { display: flex; gap: 1.8rem; list-style: none; }
        .desktop-nav a { font-weight: 600; text-decoration: none; color: var(--text-dark); transition: 0.2s; font-size: 1rem; }
        .desktop-nav a:hover { color: var(--primary-gold); }

        /* ==================== TABS ==================== */
        .tabs-container { display: flex; justify-content: center; gap: 0.8rem; margin: 2.5rem auto; max-width: 550px; background: var(--glass-bg); padding: 0.6rem; border-radius: 60px; border: 1px solid var(--glass-border); }
        .tab-btn { flex: 1; padding: 0.9rem; border-radius: 50px; border: none; cursor: pointer; font-weight: 800; background: transparent; color: var(--text-muted); transition: 0.3s; font-size: 1.05rem; }
        .tab-btn.active { background: var(--primary-green); color: white; box-shadow: 0 5px 15px rgba(26, 74, 56, 0.2); }
        [data-theme="dark"] .tab-btn.active { background: var(--primary-gold); color: var(--primary-green); }

        /* ==================== GRID SYSTEMS ==================== */
        .search-input { width: 100%; max-width: 650px; display: block; margin: 0 auto 3rem; padding: 1.2rem 2rem; border-radius: 60px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-dark); font-size: 1.1rem; outline: none; box-shadow: var(--shadow); }
        .surahs-grid, .reciters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
        
        .surah-card, .reciter-card { 
            text-align: center; padding: 2rem 1.5rem; cursor: pointer; border: 1px solid var(--glass-border); 
            border-radius: 20px; background: var(--glass-bg); transition: 0.3s; position: relative; overflow: hidden;
        }
        .surah-card:hover, .reciter-card:hover { transform: translateY(-8px); border-color: var(--primary-gold); box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15); }
        
        .btn-select-reciter { 
            text-decoration: none; background: var(--primary-gold); color: #1a4a38; padding: 0.7rem 1.5rem; 
            border-radius: 50px; font-weight: 800; display: inline-block; margin-top: 15px; width: 100%; transition: 0.2s;
        }
        .btn-select-reciter:hover { background: var(--primary-green); color: white; }

        /* ==================== PLAYER AREA ==================== */
        .custom-player { background: var(--primary-beige-dark); padding: 3rem 2rem; border-radius: 30px; text-align: center; margin-bottom: 3rem; border: 1px solid var(--glass-border); box-shadow: var(--shadow); }
        [data-theme="dark"] .custom-player { background: rgba(0,0,0,0.2); }
        .play-btn-large { width: 85px; height: 85px; border-radius: 50%; border: none; background: var(--primary-gold); color: white; font-size: 2rem; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3); }
        .play-btn-large:hover { transform: scale(1.1); background: var(--primary-green); }
        
        .progress-container { width: 100%; height: 10px; background: rgba(0,0,0,0.1); border-radius: 10px; cursor: pointer; margin-top: 2rem; position: relative; direction: ltr; }
        .progress-bar { position: absolute; left: 0; top: 0; height: 100%; background: var(--primary-gold); border-radius: 10px; width: 0%; pointer-events: none; }
        .time-display { display: flex; justify-content: space-between; direction: ltr; font-weight: 800; font-size: 0.95rem; margin-top: 10px; color: var(--text-muted); }

        .listen-surahs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.8rem; margin-top: 2rem; }
        .listen-surah-btn { padding: 1rem; cursor: pointer; border: 1px solid var(--glass-border); border-radius: 12px; background: var(--glass-bg); color: var(--text-dark); font-family: 'Amiri'; font-size: 1.2rem; font-weight: 700; transition: 0.2s; }
        .listen-surah-btn:hover, .listen-surah-btn.active { background: var(--primary-gold); color: #1a4a38; transform: scale(1.03); }

        .verse-num { color: var(--primary-gold); font-weight: 700; margin: 0 0.5rem; font-size: 0.8em; }

            .surahs-grid, .reciters-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .tabs-container { margin: 1.5rem auto; }
            .tab-btn { font-size: 0.9rem; padding: 0.7rem; }
        }
    </style>
</head>

        // ==================== 1. الحالة والمراجع (State & DOM) ====================
        const state = { 
            activeTab: 'indexTab', 
            currentReciter: null, 
            currentListenSurah: null, 
            fontSize: 1.8 
        };

        const DOM = {
            tabBtns: document.querySelectorAll('.tab-btn'), 
            tabContents: document.querySelectorAll('.tab-content'),
            surahsGrid: document.getElementById('surahsGrid'), 
            recitersGrid: document.getElementById('recitersGrid'),
            favoritesGrid: document.getElementById('favoritesGrid'), // مضافة للمفضلة
            favoritesSection: document.getElementById('favoritesSection'), // مضافة للمفضلة
            listenRecitersView: document.getElementById('listenRecitersView'), 
            listenPlayerView: document.getElementById('listenPlayerView'),
            audioPlayer: document.getElementById('audioPlayer'), 
            btnPlayPause: document.getElementById('btnPlayPause'),
            progressBar: document.getElementById('progressBar'), 
            currentTime: document.getElementById('currentTime'), 
            durationTime: document.getElementById('durationTime'),
            versesContainer: document.getElementById('versesContainer')
        };

        // ==================== 2. نظام المفضلة (LocalStorage) ====================
        let favoriteReciters = JSON.parse(localStorage.getItem('sabeel_favs')) || [];

        function updateFavoritesUI() {
            if (!DOM.favoritesSection) return;
            if (favoriteReciters.length === 0) {
                DOM.favoritesSection.classList.add('hidden');
                return;
            }
            DOM.favoritesSection.classList.remove('hidden');
            const favoredReciters = recitersData.filter(r => favoriteReciters.includes(r.id));
            DOM.favoritesGrid.innerHTML = favoredReciters.map(r => renderReciterCard(r)).join('');
        }

        function toggleFavorite(id, event) {
            event.stopPropagation();
            if (favoriteReciters.includes(id)) {
                favoriteReciters = favoriteReciters.filter(favId => favId !== id);
            } else {
                favoriteReciters.push(id);
            }
            localStorage.setItem('sabeel_favs', JSON.stringify(favoriteReciters));
            updateFavoritesUI();
            renderReciters(document.getElementById('searchReciterInput').value);
        }

        // ==================== 3. وظائف التشغيل (Initialization) ====================
        function init() {
            renderSurahCards(); 
            renderReciters(); 
            setupEvents();
            handleRouting();
            updateFavoritesUI();
            
            window.addEventListener('hashchange', handleRouting);
            
            const savedTheme = localStorage.getItem('sabeel_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        function handleRouting() {
            const hash = window.location.hash;
            if (hash.startsWith('#/reciter/')) {
                const rId = parseInt(hash.replace('#/reciter/', ''));
                if (!isNaN(rId)) { switchTab('listenTab'); selectReciter(rId, false); }
            } else {
                if (state.activeTab === 'listenTab') {
                    DOM.listenPlayerView.classList.add('hidden');
                    DOM.listenRecitersView.classList.remove('hidden');
                    stopAudio();
                }
            }
        }

        function setupEvents() {
            DOM.tabBtns.forEach(btn => btn.onclick = () => switchTab(btn.dataset.target));
            document.getElementById('searchInput').oninput = (e) => renderSurahCards(e.target.value);
            document.getElementById('searchReciterInput').oninput = (e) => renderReciters(e.target.value);
            DOM.btnPlayPause.onclick = toggleAudio;
            DOM.audioPlayer.ontimeupdate = updateProgress;
            document.getElementById('progressContainer').onclick = setAudioProgress;
            document.getElementById('themeToggle').onclick = () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('sabeel_theme', next);
            };
        }

        // ==================== 4. وظائف العرض (Rendering) ====================
        function switchTab(id) {
            state.activeTab = id;
            DOM.tabBtns.forEach(b => b.classList.toggle('active', b.dataset.target === id));
            DOM.tabContents.forEach(c => c.classList.toggle('hidden', c.id !== id));
        }

        function renderSurahCards(f='') {
            DOM.surahsGrid.innerHTML = surahsData.filter(s => s.name.includes(f)).map(s => `
                <div class="surah-card" onclick="openSurahDetails(${s.id})">
                    <div style="font-weight:900; font-size:1.2rem; color:var(--primary-gold); margin-bottom:10px;">${s.id}</div>
                    <div style="font-family:'Amiri'; font-size:1.8rem; font-weight:700;">${s.name}</div>
                    <div style="color:var(--text-muted); font-size:0.9rem;">آياتها: ${s.verses}</div>
                </div>`).join('');
        }

        function renderReciterCard(r) {
            const isFav = favoriteReciters.includes(r.id);
            const heartIcon = isFav ? '❤️' : '🤍';
            return `
                <div class="reciter-card">
                    <div onclick="toggleFavorite(${r.id}, event)" style="position:absolute; top:15px; left:15px; font-size:1.5rem; cursor:pointer; z-index:10;">
                        ${heartIcon}
                    </div>
                    <div style="font-size:3rem; margin-bottom:10px;">👤</div>
                    <div style="font-weight:800; font-size:1.2rem; min-height:3rem;">${r.name}</div>
                    <a href="#/reciter/${r.id}" class="btn-select-reciter" onclick="event.preventDefault(); selectReciter(${r.id});">استماع وتصفح</a>
                </div>`;
        }

        function renderReciters(f='') {
            const filtered = recitersData.filter(r => r.name.includes(f));
            DOM.recitersGrid.innerHTML = filtered.map(r => renderReciterCard(r)).join('');
        }

        // ==================== 5. وظائف القراءة والاستماع ====================
        function openSurahDetails(id) {
            state.currentReadSurah = surahsData.find(x => x.id === id);
            document.getElementById('detName').textContent = "سورة " + state.currentReadSurah.name;
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailsView').classList.remove('hidden');
        }

        function backToIndex() {
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('detailsView').classList.add('hidden');
        }

        async function showReadingMode() {
            switchTab('readTab');
            const s = state.currentReadSurah;
            document.getElementById('readingTitle').textContent = "سورة " + s.name;
            DOM.versesContainer.innerHTML = "<p style='text-align:center;'>جاري تحميل الآيات...</p>";
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${s.id}`);
                const data = await res.json();
                DOM.versesContainer.innerHTML = data.data.ayahs.map(a => 
                    a.text + ` <span class="verse-num">(${toArabicNumber(a.numberInSurah)})</span>`
                ).join(' ');
            } catch(e) { DOM.versesContainer.textContent = "خطأ في الاتصال بالسيرفر."; }
        }

        function selectReciter(id, updateHash = true) {
            state.currentReciter = recitersData.find(r => r.id === id);
            if(!state.currentReciter) return;
            document.getElementById('currentReciterNameLabel').textContent = "بصوت القارئ: " + state.currentReciter.name;
            DOM.listenRecitersView.classList.add('hidden');
            DOM.listenPlayerView.classList.remove('hidden');
            renderListenSurahs();
            if (updateHash) window.location.hash = `/reciter/${id}`;
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function renderListenSurahs() {
            document.getElementById('listenSurahsGrid').innerHTML = surahsData.map(s => `
                <button class="listen-surah-btn ${state.currentListenSurah?.id === s.id ? 'active' : ''}" onclick="playAudio(${s.id})">
                    ${s.name}
                </button>`).join('');
        }

        function playAudio(id) {
            state.currentListenSurah = surahsData.find(s => s.id === id);
            document.getElementById('audioSurahTitle').textContent = "سورة " + state.currentListenSurah.name;
            document.querySelectorAll('.listen-surah-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === state.currentListenSurah.name));
            DOM.audioPlayer.src = `${state.currentReciter.url}${String(id).padStart(3, '0')}.mp3`;
            DOM.audioPlayer.play();
            DOM.btnPlayPause.textContent = '⏸';
        }

        function toggleAudio() {
            if(!DOM.audioPlayer.src) return;
            if(DOM.audioPlayer.paused) { DOM.audioPlayer.play(); DOM.btnPlayPause.textContent = '⏸'; }
            else { DOM.audioPlayer.pause(); DOM.btnPlayPause.textContent = '▶'; }
        }

        function stopAudio() { 
            DOM.audioPlayer.pause(); 
            DOM.audioPlayer.currentTime = 0; 
            DOM.btnPlayPause.textContent = '▶'; 
            DOM.progressBar.style.width = '0%'; 
        }
        
        function updateProgress() {
            if(!DOM.audioPlayer.duration) return;
            const p = (DOM.audioPlayer.currentTime / DOM.audioPlayer.duration) * 100;
            DOM.progressBar.style.width = p + '%';
            DOM.currentTime.textContent = formatTime(DOM.audioPlayer.currentTime);
            DOM.durationTime.textContent = formatTime(DOM.audioPlayer.duration);
        }

        function setAudioProgress(e) {
            const rect = document.getElementById('progressContainer').getBoundingClientRect();
            const p = (e.clientX - rect.left) / rect.width;
            DOM.audioPlayer.currentTime = p * DOM.audioPlayer.duration;
        }

        function changeFontSize(v) { 
            state.fontSize += v; 
            DOM.versesContainer.style.fontSize = state.fontSize + 'rem'; 
        }
        
        function formatTime(s) { 
            const m = Math.floor(s/60); 
            const sec = Math.floor(s%60); 
            return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; 
        }
        
        function toArabicNumber(n) { 
            const a=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; 
            return String(n).split('').map(c=>a[c]||c).join(''); 
        }

        // تشغيل كل شيء
        init();
    </script>
