<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبيل - القرآن الكريم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ==================== VARIABLES & THEME ==================== */
        :root {
            --primary-beige: #fdfbf7; --primary-beige-dark: #f0e8d5;
            --primary-green: #1a4a38; --primary-gold: #d4af37;
            --text-dark: #1f2937; --text-muted: #6b7280;
            --glass-bg: rgba(253, 251, 247, 0.96); --glass-border: rgba(212, 175, 55, 0.3);
            --quran-font-size: 2rem; --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --primary-beige: #0f172a; --primary-beige-dark: #1e293b;
            --primary-green: #064e3b; --primary-gold: #fbbf24;
            --text-dark: #f8fafc; --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.96);
        }

        /* ==================== GLOBAL STYLES ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--primary-beige); color: var(--text-dark); min-height: 100vh; transition: 0.3s; position: relative; padding-bottom: 140px; }
        
        /* BACKGROUND IMAGE */
        .site-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?q=80&w=2000'); background-size: cover; background-position: center; z-index: -2; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(8px); z-index: -1; }
        [data-theme="dark"] .bg-overlay { background: rgba(15, 23, 42, 0.88); }

        .container { width: 100%; max-width: 1200px; padding: 0 1.5rem; margin: 0 auto; }
        .glass-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: var(--shadow); padding: 2rem; transition: 0.3s; }
        .hidden { display: none !important; }

        /* ==================== HEADER ==================== */
        header { padding: 1.2rem 0; position: sticky; top: 0; z-index: 100; background: var(--glass-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; font-weight: 800; color: var(--primary-green); text-decoration: none; font-family: 'Amiri'; }
        [data-theme="dark"] .logo { color: var(--primary-gold); }
        .desktop-nav ul { display: flex; gap: 1.8rem; list-style: none; }
        .desktop-nav a { font-weight: 600; text-decoration: none; color: var(--text-dark); transition: 0.2s; font-size: 1rem; }
        .desktop-nav a:hover { color: var(--primary-gold); }

        /* ==================== TABS ==================== */
        .tabs-container { display: flex; justify-content: center; gap: 0.8rem; margin: 2.5rem auto; max-width: 550px; background: var(--glass-bg); padding: 0.6rem; border-radius: 60px; border: 1px solid var(--glass-border); }
        .tab-btn { flex: 1; padding: 0.9rem; border-radius: 50px; border: none; cursor: pointer; font-weight: 800; background: transparent; color: var(--text-muted); transition: 0.3s; font-size: 1.05rem; }
        .tab-btn.active { background: var(--primary-green); color: white; box-shadow: 0 5px 15px rgba(26, 74, 56, 0.2); }
        [data-theme="dark"] .tab-btn.active { background: var(--primary-gold); color: var(--primary-green); }

        /* ==================== GRID SYSTEMS ==================== */
        .search-input { width: 100%; max-width: 650px; display: block; margin: 0 auto 3rem; padding: 1.2rem 2rem; border-radius: 60px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-dark); font-size: 1.1rem; outline: none; box-shadow: var(--shadow); }
        .surahs-grid, .reciters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
        
        .surah-card, .reciter-card { 
            text-align: center; padding: 2rem 1.5rem; cursor: pointer; border: 1px solid var(--glass-border); 
            border-radius: 20px; background: var(--glass-bg); transition: 0.3s; position: relative; overflow: hidden;
        }
        .surah-card:hover, .reciter-card:hover { transform: translateY(-8px); border-color: var(--primary-gold); box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15); }
        
        .btn-select-reciter { 
            text-decoration: none; background: var(--primary-gold); color: #1a4a38; padding: 0.7rem 1.5rem; 
            border-radius: 50px; font-weight: 800; display: inline-block; margin-top: 15px; width: 100%; transition: 0.2s;
        }
        .btn-select-reciter:hover { background: var(--primary-green); color: white; }

        .listen-surahs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.8rem; margin-top: 2rem; }
        .listen-surah-btn { padding: 1rem; cursor: pointer; border: 1px solid var(--glass-border); border-radius: 12px; background: var(--glass-bg); color: var(--text-dark); font-family: 'Amiri'; font-size: 1.2rem; font-weight: 700; transition: 0.2s; }
        .listen-surah-btn:hover, .listen-surah-btn.active { background: var(--primary-gold); color: #1a4a38; transform: scale(1.03); }

        /* ==================== GLOBAL PLAYER AREA (STICKY BOTTOM) ==================== */
        .global-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 1rem 2rem;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
        }
        .global-player.active { transform: translateY(0); }
        
        .player-content {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            gap: 1.5rem;
        }
        .player-info { display: flex; flex-direction: column; align-items: flex-start; }
        
        .player-center { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; width: 100%; }
        .player-controls { display: flex; align-items: center; gap: 2rem; }
        
        .control-btn {
            background: none; border: none; font-size: 1.8rem; color: var(--primary-green);
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        [data-theme="dark"] .control-btn { color: var(--primary-gold); }
        .control-btn:hover { transform: scale(1.15); color: var(--primary-gold); }
        
        .play-btn-large {
            width: 55px; height: 55px; border-radius: 50%; border: none; background: var(--primary-gold); 
            color: white; font-size: 1.4rem; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            display: flex; align-items: center; justify-content: center;
        }
        .play-btn-large:hover { transform: scale(1.1); background: var(--primary-green); }

        .player-volume { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 250px; }
        .volume-slider { width: 100%; accent-color: var(--primary-gold); cursor: pointer; }

        .progress-wrapper { width: 100%; display: flex; align-items: center; gap: 15px; }
        .time-display-inline { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); min-width: 45px; text-align: center; direction: ltr; }
        
        .progress-container { width: 100%; height: 8px; background: rgba(0,0,0,0.1); border-radius: 10px; cursor: pointer; position: relative; direction: ltr; flex: 1; }
        [data-theme="dark"] .progress-container { background: rgba(255,255,255,0.1); }
        .progress-bar { position: absolute; left: 0; top: 0; height: 100%; background: var(--primary-gold); border-radius: 10px; width: 0%; pointer-events: none; transition: width 0.1s linear; }

        /* ==================== READING AREA ==================== */
        .verses-container { font-family: 'Amiri', serif; font-size: var(--quran-font-size); text-align: justify; text-align-last: center; line-height: 2.8; padding: 2rem; }
        .verse-num { color: var(--primary-gold); font-weight: 700; margin: 0 0.5rem; font-size: 0.8em; }

        @media (max-width: 768px) {
            .desktop-nav { display: none; }
            .surahs-grid, .reciters-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .tabs-container { margin: 1.5rem auto; }
            .tab-btn { font-size: 0.9rem; padding: 0.7rem; }
            .player-content { display: flex; flex-direction: column; gap: 1rem; }
            .player-info { align-items: center; text-align: center; }
            .global-player { padding: 1rem; }
            body { padding-bottom: 220px; }
        }
    </style>
</head>
<body>

    <div class="site-bg"></div>
    <div class="bg-overlay"></div>

    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">سبيل</a>
            <nav class="desktop-nav">
                <ul>
                    <li><a href="masbaha.html">المسبحة</a></li>
                    <li><a href="odea.html">الأدعية</a></li>
                    <li><a href="quran.html" style="color: var(--primary-gold);">القرآن</a></li>
                    <li><a href="hadith.html">أحاديث نبوية</a></li>
                    <li><a href="sira.html">السيرة النبوية</a></li>
                    <li><a href="sahaba.html">عظماء الصحابة</a></li>
                    <li><a href="prophets.html">قصص الأنبياء</a></li>
                    <li><a href="azkar.html">الأذكار</a></li>
                </ul>
            </nav>
            <button id="themeToggle" style="background:none; border:none; font-size:1.6rem; cursor:pointer;">🌙</button>
        </div>
    </header>

    <main class="container">
        <div class="tabs-container">
            <button class="tab-btn" data-target="readTab">📖 قراءة</button>
            <button class="tab-btn active" data-target="indexTab">📜 الفهرس</button>
            <button class="tab-btn" data-target="listenTab">🎧 استماع</button>
        </div>

        <div id="indexTab" class="tab-content">
            <div id="favoritesSection" class="hidden" style="margin-bottom: 3rem;">
                <h2 style="margin-bottom: 1.5rem; color: var(--primary-gold); font-weight: 800;">⭐ قراءك المفضلون</h2>
                <div class="reciters-grid" id="favoritesGrid"></div>
                <hr style="margin-top: 2rem; border: 0; border-top: 1px solid var(--glass-border);">
            </div>
            <div id="listView">
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن سورة... (مثال: الكهف)">
                <div class="surahs-grid" id="surahsGrid"></div>
            </div>
            <div id="detailsView" class="glass-card hidden" style="text-align:center; max-width: 700px; margin: 0 auto;">
                <h2 id="detName" style="font-family:'Amiri'; font-size:3.5rem; color: var(--primary-green); margin-bottom: 1.5rem;"></h2>
                <button onclick="showReadingMode()" style="padding:1.2rem 3rem; border-radius:60px; background:var(--primary-green); color:white; border:none; cursor:pointer; font-weight:800; font-size: 1.2rem;">📖 ابدأ القراءة الآن</button>
                <button onclick="backToIndex()" style="display:block; margin: 2rem auto 0; background:none; border:none; color:var(--text-muted); cursor:pointer; font-weight:700;">← العودة للفهرس</button>
            </div>
        </div>

        <div id="readTab" class="tab-content hidden glass-card" style="max-width: 1000px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary-gold); padding-bottom: 1.5rem; margin-bottom: 2rem;">
                 <h2 id="readingTitle" style="font-family:'Amiri'; font-size: 2.5rem; color: var(--primary-green);"></h2>
                 <div>
                    <button onclick="changeFontSize(0.2)" style="width:40px; height:40px; border-radius:50%; border:1px solid var(--primary-gold); cursor:pointer; font-weight:bold;">+</button>
                    <button onclick="changeFontSize(-0.2)" style="width:40px; height:40px; border-radius:50%; border:1px solid var(--primary-gold); cursor:pointer; font-weight:bold;">-</button>
                 </div>
            </div>
            <div id="versesContainer" class="verses-container"></div>
        </div>

        <div id="listenTab" class="tab-content hidden glass-card">
            <div id="listenRecitersView">
                <h2 style="text-align: center; margin-bottom: 2rem; font-weight: 800;">اختر القارئ</h2>
                <input type="text" id="searchReciterInput" class="search-input" placeholder="ابحث عن قارئ... (مثال: العفاسي)">
                <div class="reciters-grid" id="recitersGrid"></div>
            </div>

            <div id="listenPlayerView" class="hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                    <button onclick="backToReciters()" style="cursor:pointer; background:none; border:none; font-weight:800; color:var(--primary-green); font-size: 1.1rem;">⇦ العودة لقائمة القراء</button>
                    <h2 id="viewReciterName" style="color:var(--primary-gold); font-family:'Amiri'; font-size: 2.2rem; margin: 0;"></h2>
                </div>
                
                <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 2rem 0;">
                <h3 style="margin: 0 0 1.5rem; text-align: center; font-size: 1.8rem; font-family: 'Amiri'; color: var(--primary-green);">اختر السورة للاستماع</h3>
                <div class="listen-surahs-grid" id="listenSurahsGrid"></div>
            </div>
        </div>
    </main>

    <div id="globalPlayer" class="global-player">
        <div class="player-content">
            <div class="player-info">
                <div id="audioSurahTitle" style="font-family:'Amiri'; font-size:1.6rem; color: var(--primary-green); font-weight:800; margin-bottom: 5px;"></div>
                <div id="currentReciterNameLabel" style="color:var(--primary-gold); font-size:1.1rem; font-weight:700;"></div>
            </div>
            
            <div class="player-center">
                <div class="player-controls">
                    <button class="control-btn" id="btnPrev" onclick="playPrev()" title="السابق">⏭</button>
                    <button class="play-btn-large" id="btnPlayPause">▶</button>
                    <button class="control-btn" id="btnNext" onclick="playNext()" title="التالي">⏮</button>
                </div>
                
                <div class="player-volume">
                    <span style="font-size:1rem; opacity: 0.7;">🔈</span>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
                    <span style="font-size:1rem; opacity: 0.7;">🔊</span>
                </div>

                <div class="progress-wrapper">
                    <span id="currentTime" class="time-display-inline">00:00</span>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <span id="durationTime" class="time-display-inline">00:00</span>
                </div>
            </div>
            
            <div></div>
        </div>
        <audio id="audioPlayer"></audio>
    </div>

            { id: 87, name: "ياسر سلامة", url: "https://server12.mp3quran.net/salamah/Rewayat-Hafs-A-n-Assem/", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQY3va_gFILe8jnEwfHStU8qDsnG8Fh399ZRg&s"  },
            { id: 88, name: "ياسين الجزائري", url: "https://server11.mp3quran.net/qari/" , img: "https://www.almutadaber.com/public/assest/images/%D9%8A%D8%A7%D8%B3%D9%8A%D9%86%20%D8%A7%D9%84%D8%AC%D8%B2%D8%A7%D8%A6%D8%B1%D9%8A.jpg" }
        ];

        // ==================== 1. الحالة والمراجع ====================
        const state = { 
            activeTab: 'indexTab', 
            currentReciter: null, 
            currentListenSurah: null, 
            fontSize: 1.8 
        };

        const DOM = {
            tabBtns: document.querySelectorAll('.tab-btn'), 
            tabContents: document.querySelectorAll('.tab-content'),
            surahsGrid: document.getElementById('surahsGrid'), 
            recitersGrid: document.getElementById('recitersGrid'),
            favoritesGrid: document.getElementById('favoritesGrid'),
            favoritesSection: document.getElementById('favoritesSection'),
            listenRecitersView: document.getElementById('listenRecitersView'), 
            listenPlayerView: document.getElementById('listenPlayerView'),
            audioPlayer: document.getElementById('audioPlayer'), 
            btnPlayPause: document.getElementById('btnPlayPause'),
            progressBar: document.getElementById('progressBar'), 
            currentTime: document.getElementById('currentTime'), 
            durationTime: document.getElementById('durationTime'),
            versesContainer: document.getElementById('versesContainer'),
            globalPlayer: document.getElementById('globalPlayer')
        };

        // ==================== 2. نظام المفضلة ====================
        let favoriteReciters = JSON.parse(localStorage.getItem('sabeel_favs')) || [];

        function updateFavoritesUI() {
            if (!DOM.favoritesSection) return;
            if (favoriteReciters.length === 0) {
                DOM.favoritesSection.classList.add('hidden');
                return;
            }
            DOM.favoritesSection.classList.remove('hidden');
            const favoredReciters = recitersData.filter(r => favoriteReciters.includes(r.id));
            DOM.favoritesGrid.innerHTML = favoredReciters.map(r => renderReciterCard(r)).join('');
        }

        function toggleFavorite(id, event) {
            event.stopPropagation();
            if (favoriteReciters.includes(id)) {
                favoriteReciters = favoriteReciters.filter(favId => favId !== id);
            } else {
                favoriteReciters.push(id);
            }
            localStorage.setItem('sabeel_favs', JSON.stringify(favoriteReciters));
            updateFavoritesUI();
            renderReciters(document.getElementById('searchReciterInput').value);
        }

        // ==================== 3. وظائف التشغيل ====================
        function init() {
            renderSurahCards(); 
            setupEvents();
            handleRouting();
            updateFavoritesUI();
            renderReciters();
            
            checkSurahDeepLink(); 

            window.addEventListener('hashchange', handleRouting);
            const savedTheme = localStorage.getItem('sabeel_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        function handleRouting() {
            const hash = window.location.hash;

            if (hash.startsWith('#/reciter/')) {
                const rId = parseInt(hash.replace('#/reciter/', ''));
                if (!isNaN(rId)) { 
                    switchTab('listenTab', false); 
                    selectReciter(rId, false); 
                }
            } 
            else if (hash.startsWith('#/surah/')) {
                const sId = parseInt(hash.replace('#/surah/', ''));
                const s = surahsData.find(x => x.id === sId);
                if (s) {
                    state.currentReadSurah = s;
                    switchTab('readTab', false);
                    showReadingMode();
                }
            }
            else {
                if (hash === '#/read') switchTab('readTab', false);
                else if (hash === '#/listen') switchTab('listenTab', false);
                else {
                    switchTab('indexTab', false);
                    backToIndex(); 
                }
            }
        }

        function setupEvents() {
            DOM.tabBtns.forEach(btn => btn.onclick = () => switchTab(btn.dataset.target));
            document.getElementById('searchInput').oninput = (e) => renderSurahCards(e.target.value);
            document.getElementById('searchReciterInput').oninput = (e) => renderReciters(e.target.value);
            
            DOM.btnPlayPause.onclick = toggleAudio;
            DOM.audioPlayer.ontimeupdate = updateProgress;
            document.getElementById('progressContainer').onclick = setAudioProgress;
            
            // التشغيل التلقائي للسورة التالية
            DOM.audioPlayer.addEventListener('ended', playNext);
            
            // التحكم في مستوى الصوت
            const volSlider = document.getElementById('volumeSlider');
            volSlider.addEventListener('input', (e) => {
                DOM.audioPlayer.volume = e.target.value;
            });

            document.getElementById('themeToggle').onclick = () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('sabeel_theme', next);
            };
        }

        // ==================== 4. وظائف العرض ====================
        function switchTab(id, updateHash = true) {
            state.activeTab = id;
            DOM.tabBtns.forEach(b => b.classList.toggle('active', b.dataset.target === id));
            DOM.tabContents.forEach(c => c.classList.toggle('hidden', c.id !== id));
            
            if (updateHash) {
                const hashMap = { 'indexTab': '#/index', 'readTab': '#/read', 'listenTab': '#/listen' };
                window.location.hash = hashMap[id] || '#/index';
            }
        }

        function renderSurahCards(f='') {
            DOM.surahsGrid.innerHTML = surahsData.filter(s => s.name.includes(f)).map(s => `
                <div class="surah-card" onclick="openSurahDetails(${s.id})">
                    <div style="font-weight:900; font-size:1.2rem; color:var(--primary-gold); margin-bottom:10px;">${s.id}</div>
                    <div style="font-family:'Amiri'; font-size:1.8rem; font-weight:700;">${s.name}</div>
                    <div style="color:var(--text-muted); font-size:0.9rem;">آياتها: ${s.verses}</div>
                </div>`).join('');
        }

        function renderReciterCard(r) {
            const isFav = favoriteReciters.includes(r.id);
            const heartIcon = isFav ? '❤️' : '🤍';
            return `
                <div class="reciter-card">
                    <div onclick="toggleFavorite(${r.id}, event)" style="position:absolute; top:15px; left:15px; font-size:1.5rem; cursor:pointer; z-index:10;">
                        ${heartIcon}
                    </div>
                    <img src="${r.img || 'https://via.placeholder.com/120'}" 
     style="width:100px; height:100px; border-radius:50%; object-fit:cover; margin-bottom:10px;">
                    <div style="font-weight:800; font-size:1.2rem; min-height:3rem;">${r.name}</div>
                    <a href="#/reciter/${r.id}" class="btn-select-reciter" onclick="event.preventDefault(); selectReciter(${r.id});">استماع وتصفح</a>
                </div>`;
        }

        function renderReciters(f='') {
            const filtered = recitersData.filter(r => r.name.includes(f));
            DOM.recitersGrid.innerHTML = filtered.map(r => renderReciterCard(r)).join('');
        }

        // ==================== 5. وظائف القراءة والاستماع ====================
        function openSurahDetails(id) {
            state.currentReadSurah = surahsData.find(x => x.id === id);
            document.getElementById('detName').textContent = "سورة " + state.currentReadSurah.name;
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailsView').classList.remove('hidden');
            
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?surah=' + id;
            window.history.pushState({path:newUrl}, '', newUrl);
        }

        function backToIndex() {
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('detailsView').classList.add('hidden');
            
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path:newUrl}, '', newUrl);
        }

        async function showReadingMode() {
            switchTab('readTab');
            const s = state.currentReadSurah;
            document.getElementById('readingTitle').textContent = "سورة " + s.name;
            DOM.versesContainer.innerHTML = "<p style='text-align:center;'>جاري تحميل الآيات...</p>";
            
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${s.id}/quran-uthmani`);
                const data = await res.json();

                DOM.versesContainer.innerHTML = data.data.ayahs.map((a, index) => {
                    let verseText = a.text;
                    if (index === 0 && s.id !== 1 && s.id !== 9) {
                        const bismillah = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
                        if (verseText.startsWith(bismillah)) {
                            verseText = verseText.substring(bismillah.length).trim();
                        } else {
                            verseText = verseText.replace(/^.{38}/, "").trim();
                        }
                    }
                    return verseText + ` <span class="verse-num">(${toArabicNumber(a.numberInSurah)})</span>`;
                }).join(' ');

            } catch(e) { 
                DOM.versesContainer.textContent = "خطأ في الاتصال بالسيرفر."; 
            }
        }

        function selectReciter(id, updateHash = true) {
    state.currentReciter = recitersData.find(r => r.id === id);
    if(!state.currentReciter) return;
    
    // تغيير اسم القارئ في صفحة الاستماع (العلوي)
    document.getElementById('viewReciterName').textContent = state.currentReciter.name;
    
    DOM.listenRecitersView.classList.add('hidden');
    DOM.listenPlayerView.classList.remove('hidden');
    renderListenSurahs();
    if (updateHash) window.location.hash = `/reciter/${id}`;
    window.scrollTo({top:0, behavior:'smooth'});
}

function backToReciters() {
    // نخفيو واجهة اختيار السور (المشغل)
    DOM.listenPlayerView.classList.add('hidden');
    
    // نرجعو نبينو قائمة القراء
    DOM.listenRecitersView.classList.remove('hidden');
    
    // نحدثو الرابط باش يبقى في قسم الاستماع وميرجعناش للفهرس
    window.location.hash = '#/listen';
}

        function renderListenSurahs() {
            document.getElementById('listenSurahsGrid').innerHTML = surahsData.map(s => `
                <button class="listen-surah-btn ${state.currentListenSurah?.id === s.id ? 'active' : ''}" onclick="playAudio(${s.id})">
                    ${s.name}
                </button>`).join('');
        }

        function playAudio(id) {
            state.currentListenSurah = surahsData.find(s => s.id === id);
            
            // تحديث الشريط السفلي
            document.getElementById('audioSurahTitle').textContent = "سورة " + state.currentListenSurah.name;
            document.getElementById('currentReciterNameLabel').textContent = state.currentReciter.name;
            
            document.querySelectorAll('.listen-surah-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === state.currentListenSurah.name));
            
            DOM.audioPlayer.src = `${state.currentReciter.url}${String(id).padStart(3, '0')}.mp3`;
            DOM.audioPlayer.play();
            DOM.btnPlayPause.textContent = '⏸';
            
            // إظهار الشريط السفلي
            DOM.globalPlayer.classList.add('active');
        }

        function playNext() {
            if (!state.currentListenSurah) return;
            const currentIndex = surahsData.findIndex(s => s.id === state.currentListenSurah.id);
            if (currentIndex < surahsData.length - 1) {
                playAudio(surahsData[currentIndex + 1].id);
            }
        }

        function playPrev() {
            if (!state.currentListenSurah) return;
            const currentIndex = surahsData.findIndex(s => s.id === state.currentListenSurah.id);
            if (currentIndex > 0) {
                playAudio(surahsData[currentIndex - 1].id);
            }
        }

        function toggleAudio() {
            if(!DOM.audioPlayer.src) return;
            if(DOM.audioPlayer.paused) { DOM.audioPlayer.play(); DOM.btnPlayPause.textContent = '⏸'; }
            else { DOM.audioPlayer.pause(); DOM.btnPlayPause.textContent = '▶'; }
        }

        function updateProgress() {
            if(!DOM.audioPlayer.duration) return;
            const p = (DOM.audioPlayer.currentTime / DOM.audioPlayer.duration) * 100;
            DOM.progressBar.style.width = p + '%';
            DOM.currentTime.textContent = formatTime(DOM.audioPlayer.currentTime);
            DOM.durationTime.textContent = formatTime(DOM.audioPlayer.duration);
        }

        function setAudioProgress(e) {
            const rect = document.getElementById('progressContainer').getBoundingClientRect();
            const p = (e.clientX - rect.left) / rect.width;
            DOM.audioPlayer.currentTime = p * DOM.audioPlayer.duration;
        }

        function changeFontSize(v) { 
            state.fontSize += v; 
            DOM.versesContainer.style.fontSize = state.fontSize + 'rem'; 
        }
        
        function formatTime(s) { 
            const m = Math.floor(s/60); 
            const sec = Math.floor(s%60); 
            return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; 
        }
        
        function toArabicNumber(n) { 
            const a=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; 
            return String(n).split('').map(c=>a[c]||c).join(''); 
        }

        function checkSurahDeepLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const surahId = urlParams.get('surah');
            if (surahId) {
                const s = surahsData.find(x => x.id == surahId);
                if (s) {
                    state.currentReadSurah = s;
                    showReadingMode();
                }
            }
        }

        // تشغيل كل شيء
        init();
    </script>
</body>
</html>
